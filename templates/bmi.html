{% extends "base.html" %}
{% block title %}BMI Calculator — ACEest Fitness{% endblock %}
{% block content %}
<h1>BMI Calculator</h1>

<div class="card">
    <form method="POST" action="{{ url_for('bmi') }}" class="form-inline-grid">
        <div class="form-group">
            <label for="bmi-weight">Weight (kg)</label>
            <input type="number" step="0.1" id="bmi-weight" name="weight" required placeholder="e.g., 75" value="{{ result.weight if result else '' }}">
        </div>
        <div class="form-group">
            <label for="bmi-height">Height (cm)</label>
            <input type="number" step="0.1" id="bmi-height" name="height" required placeholder="e.g., 175" value="{{ result.height if result else '' }}">
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Calculate BMI</button>
        </div>
    </form>
</div>

{% if result %}
<div class="card">
    <h2>Result</h2>
    <div class="bmi-result">
        <div class="bmi-value">{{ result.bmi }}</div>
        <div class="bmi-badge bmi-{{ result.category|lower }}">{{ result.category }}</div>
        <p class="text-muted">{{ result.risk }}</p>
    </div>
</div>
{% endif %}
{% endblock %}
