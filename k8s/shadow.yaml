# This requires an Ingress controller like NGINX or Istio to handle traffic mirroring.
# Below is a conceptual representation using NGINX Ingress annotations.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-primary
  namespace: aceest-fitness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      version: primary
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: primary
    spec:
      containers:
      - name: aceest-fitness
        image: vmpranavan/aceest-fitness:v3.2.4
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-primary-svc
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-fitness
    version: primary
  ports:
  - port: 80
    targetPort: 5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
  namespace: aceest-fitness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      version: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: shadow
    spec:
      containers:
      - name: aceest-fitness
        image: vmpranavan/aceest-fitness:v4.0.0
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-shadow-svc
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-fitness
    version: shadow
  ports:
  - port: 80
    targetPort: 5000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-fitness-shadow-ingress
  namespace: aceest-fitness
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-fitness-shadow-svc.aceest-fitness.svc.cluster.local"
spec:
  rules:
  - host: aceest.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-fitness-primary-svc
            port:
              number: 80
