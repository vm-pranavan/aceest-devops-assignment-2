# SonarQube Project Configuration for ACEest Fitness
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness CI/CD
sonar.projectVersion=4.0.0

# Source directories
sonar.sources=app.py, templates, static
sonar.tests=tests

# Python configuration
sonar.language=py
sonar.python.version=3.11

# Coverage configuration
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=venv/**, .git/**, tests/**, __pycache__/**, k8s/**, *.docx
